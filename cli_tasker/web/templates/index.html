<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Task Manager</title>
</head>
<body>
    <h1>Task Manager</h1>

        <ul id="tasks"></ul>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
